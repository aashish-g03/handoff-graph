<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
.frame{width:960px;height:540px;background:var(--graphite);position:relative;padding:0 80px;display:flex;flex-direction:column;justify-content:center}
.frame::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--graphite-rule) 1px,transparent 1px),linear-gradient(90deg,var(--graphite-rule) 1px,transparent 1px);background-size:40px 40px;opacity:.22}
.frame>*{position:relative}
h1{color:var(--on-g);font-size:44px;margin-bottom:26px}
.row{display:grid;grid-template-columns:110px 1fr;gap:10px 18px;font:400 17px/1.4 "JetBrains Mono";color:var(--on-g)}
.row span{color:var(--on-g-2);font:500 11.5px/1.9 "JetBrains Mono";letter-spacing:.06em;text-transform:uppercase}
.foot{margin-top:34px;color:var(--on-g-2);font-size:13px;line-height:1.5}
</style></head><body><div class="frame">
<h1>Try it</h1>
<div class="row">
<span>Live demo</span><div>handoff-graph.up.railway.app</div>
<span>Code</span><div>github.com/aashish-g03/handoff-graph</div>
<span>MCP</span><div>handoff-graph.up.railway.app/mcp</div>
</div>
<p class="foot">Built with FalkorDB and TypeSafe Jev for Graph Hacks 2026.<br>Data: public microsoft/vscode issues. Narration voice generated with ElevenLabs.</p>
</div></body></html>
